name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install modules
        run: npm ci

      - name: Formatter check
        run: npm run format:check

      - name: Run tests
        run: npm run test

      - name: Build and verify all targets
        run: VERSION=0.0.0 npm run build

      - name: Package release targets
        run: npm run package
