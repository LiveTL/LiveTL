name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install modules
        run: yarn --frozen-lockfile

      - name: Formatter check
        run: yarn format:check

      - name: Run tests
        run: yarn test

      - name: Build and verify all targets
        run: VERSION=0.0.0 yarn build

      - name: Package release targets
        run: yarn package
