name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hyperchat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install modules
        run: npm ci

      - name: Validate HyperChat
        run: npm run check -w @livetl/hyperchat

      - name: Build and verify HyperChat targets
        run: VERSION=0.0.0 npm run build -w @livetl/hyperchat

  livetl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install modules
        run: npm ci

      - name: Validate LiveTL
        run: npm run check -w @livetl/livetl

      - name: Build and verify LiveTL targets
        run: VERSION=0.0.0 npm run build -w @livetl/livetl

      - name: Package release targets
        run: npm run package -w @livetl/livetl
