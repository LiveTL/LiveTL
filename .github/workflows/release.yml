name: Latest Release Build

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and upload
        required: true
        type: string

jobs:
  build:
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - run: |
          npm ci
          npm run lint:check

          # Extract version number from the tag
          VERSION=$(echo -n "$RELEASE_TAG" | sed 's/^v//g' | sed 's/-.*//')

          VERSION="$VERSION" npm run build:chrome
          VERSION="$VERSION" npm run build:firefox

      - name: Upload Chrome package to release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/HyperChat-chrome.zip
          asset_name: HyperChat-Chrome.zip
          tag: ${{ env.RELEASE_TAG }}
          overwrite: true

      - name: Upload Firefox package to release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/HyperChat-firefox.zip
          asset_name: HyperChat-Firefox.zip
          tag: ${{ env.RELEASE_TAG }}
          overwrite: true
