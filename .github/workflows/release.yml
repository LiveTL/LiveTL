name: Latest Release Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          RELEASE_TAG="${INPUT_TAG:-$EVENT_TAG}"
          VERSION="${RELEASE_TAG#v}"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION%%-*}" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install modules
        run: npm ci

      - name: Build extensions
        run: |
          npm run update:list
          VERSION="$VERSION" npm run build
          npm run package

      - name: Upload Chrome build to release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: apps/LiveTL/build/LiveTL-Chrome.zip
          asset_name: LiveTL-Chrome.zip
          tag: ${{ env.RELEASE_TAG }}
          overwrite: true

      - name: Upload Firefox build to release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: apps/LiveTL/build/LiveTL-Firefox.zip
          asset_name: LiveTL-Firefox.zip
          tag: ${{ env.RELEASE_TAG }}
          overwrite: true

      - name: Upload HyperChat Chrome build to release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: apps/HyperChat/build/HyperChat-chrome.zip
          asset_name: HyperChat-Chrome.zip
          tag: ${{ env.RELEASE_TAG }}
          overwrite: true

      - name: Upload HyperChat Firefox build to release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: apps/HyperChat/build/HyperChat-firefox.zip
          asset_name: HyperChat-Firefox.zip
          tag: ${{ env.RELEASE_TAG }}
          overwrite: true
