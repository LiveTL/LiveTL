name: Update Screenshots

on:
  workflow_dispatch:
    inputs:
      pages:
        description: 'Pages to screenshot. "all" or a list separated by commas.'
        required: true
        default: 'all'

jobs:
  update_screenshots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install modules
        run: |
          npm ci
          npm install --no-save --package-lock=false puppeteer
          sudo apt install xvfb libnss3 libatk-adaptor libcups2 libxkbcommon0 libgtk-3-0 libgbm1 fonts-indic fonts-noto fonts-noto-cjk

      - name: Build extensions
        run: |
          npm run build:production
          npm run package

      - name: Screenshot pages
        run: |
          mkdir -p apps/LiveTL/ss
          npm run ss -- ${{ github.event.inputs.pages }}

      - name: Commit screenshots
        uses: EndBug/add-and-commit@v7
        with:
          message: 'Updated screenshots'
          add: apps/LiveTL/img
